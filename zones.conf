# Canadian Timezone Shim Configuration
# Format: IANA_SOURCE|CUSTOM_ID|IANA_ABBREV|OFFICIAL_ABBREV|OFFICIAL_NAME|REFERENCE_URL
#
# This file lists Canadian jurisdictions whose official time designation
# differs from IANA's convention. For each row, the shim generates a *custom
# TZif* file under the "Canadian/" namespace in the system zoneinfo directory
# (see CUSTOM_ID below), preserving the source zone's historical transitions
# but rewriting the post-switchover abbreviation.
#
# CUSTOM_ID — the identifier the shim installs, e.g. "Canadian/PCT".
#
#     IMPORTANT: "Canadian/*" is a CUSTOM namespace owned by this shim.
#     It is NOT a set of identifiers published by IANA. Other tzdata
#     installations, IANA tools, or other time-zone libraries will not
#     know about them. Software that reads /usr/share/zoneinfo (Qt, ICU
#     when configured to, tzdata consumers, etc.) will resolve them
#     because the shim drops real TZif files at
#     /usr/share/zoneinfo/<CUSTOM_ID>.
#
# IANA_SOURCE — the official IANA zone whose TZif is copied (read-only)
#     and then patched to build the custom zone. Never modified in place.
#
# IANA_ABBREV / OFFICIAL_ABBREV — the abbreviation IANA uses for the
#     post-switchover era and the official provincial/territorial
#     abbreviation the shim substitutes. Exactly three characters each.
#
# Historical transitions and all pre-switchover abbreviations (e.g. PST,
# PDT, MST, CST, EST, ...) are preserved verbatim.
#
# Lines starting with # are comments. Empty lines are ignored.

# British Columbia — Pacific Time
# BC adopted permanent Pacific Time (PCT) on November 1, 2026.
# IANA uses MST for the year-round UTC-7 offset.
America/Vancouver|Canadian/PCT|MST|PCT|Pacific Time|https://www.gov.bc.ca/gov/content/governments/celebrating-british-columbia/daylight-saving-time

# Alberta — Alberta Time
# Alberta adopted permanent Alberta Time (ABT) on November 1, 2026.
# IANA uses CST for the year-round UTC-6 offset.
America/Edmonton|Canadian/ABT|CST|ABT|Alberta Time|https://www.alberta.ca/albertas-new-time-system-abt

# Yukon — Yukon Standard Time
# Yukon adopted permanent YST on November 1, 2020.
# IANA uses MST for the year-round UTC-7 offset.
# Whitehorse and Dawson have DIFFERENT historical LMT values
# (-09:00:12 vs -09:17:40), so they get separate custom identifiers
# rather than a shared Canadian/YST.
America/Whitehorse|Canadian/YST-Whitehorse|MST|YST|Yukon Standard Time|https://yukon.ca/en/your-government/about-yukon/learn-about-yukon-standard-time
America/Dawson|Canadian/YST-Dawson|MST|YST|Yukon Standard Time|https://yukon.ca/en/your-government/about-yukon/learn-about-yukon-standard-time

# Manitoba — Manitoba Standard Time
# Manitoba adopted permanent MBT on November 1, 2026.
# IANA uses EST for the year-round UTC-5 offset.
America/Winnipeg|Canadian/MBT|EST|MBT|Manitoba Standard Time|https://www.gov.mb.ca/timechange/

# Northwest Territories — Northwest Territories Time
# NWT adopted permanent NWT on November 1, 2026.
# IANA uses CST for the year-round UTC-6 offset.
# Note: NWT legislation does not specify an abbreviation; NWT is used
# as a reasonable default.
America/Yellowknife|Canadian/NWT|CST|NWT|Northwest Territories Time|https://gnwt.ca/sport-recreation-and-tourism/living-nwt/northwest-territories-time

# Canadian Timezone Shim Configuration
# Format: IANA_ZONE|IANA_ABBREV|OFFICIAL_ABBREV|OFFICIAL_NAME|REFERENCE_URL
#
# This file lists Canadian timezone regions where the official provincial/territorial
# designation differs from IANA's choice. The shim patches the local zoneinfo files
# to use the official abbreviations.
#
# Lines starting with # are comments. Empty lines are ignored.

# British Columbia - Pacific Time
# BC adopted permanent Pacific Time (PCT) on November 1, 2026
# IANA uses MST for consistency with other UTC-7 regions
America/Vancouver|MST|PCT|Pacific Time|https://www.gov.bc.ca/gov/content/governments/celebrating-british-columbia/daylight-saving-time

# Alberta - Alberta Time
# Alberta adopted permanent Alberta Time (ABT) on November 1, 2026
# IANA uses CST (Central Standard Time) for the permanent UTC-6 offset
America/Edmonton|CST|ABT|Alberta Time|https://www.alberta.ca/albertas-new-time-system-abt

# Yukon - Yukon Standard Time
# Yukon adopted permanent Yukon Standard Time (YST) on November 1, 2020
# IANA uses MST for the permanent UTC-7 offset
America/Whitehorse|MST|YST|Yukon Standard Time|https://yukon.ca/en/your-government/about-yukon/learn-about-yukon-standard-time
America/Dawson|MST|YST|Yukon Standard Time|https://yukon.ca/en/your-government/about-yukon/learn-about-yukon-standard-time

# Manitoba - Manitoba Standard Time
# Manitoba adopted permanent Manitoba Standard Time (MBT) on November 1, 2026
# IANA uses EST (Eastern Standard Time) for the permanent UTC-5 offset
America/Winnipeg|EST|MBT|Manitoba Standard Time|https://www.gov.mb.ca/timechange/

# Northwest Territories - Northwest Territories Time
# NWT adopted permanent Northwest Territories Time on November 1, 2026
# IANA uses CST (Central Standard Time) for the permanent UTC-6 offset
# Note: NWT legislation does not specify an abbreviation. Using NWT as a reasonable default.
America/Yellowknife|CST|NWT|Northwest Territories Time|https://gnwt.ca/sport-recreation-and-tourism/living-nwt/northwest-territories-time
